<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nine Lives Inc.</title>
<meta name="description" content="Nine Lives Inc. is a cozy idle game for Android: run an afterlife sanctuary for cats.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
  :root {
    --plum: #3e2f63;
    --plum-soft: #6b5b95;
    --lilac: #b3a2e6;
    --peach: #ffc9b0;
    --paper: #fdfbff;
    --butter: #ffe08a;
    --space-1: 8px; --space-2: 16px; --space-3: 24px; --space-4: 40px; --space-5: 64px;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    color: var(--plum);
    font: 400 17px/1.7 "Atkinson Hyperlegible", system-ui, sans-serif;
    background:
      radial-gradient(60% 40% at 15% 0%, rgba(255, 255, 255, .45), transparent 70%),
      radial-gradient(50% 35% at 90% 100%, rgba(255, 224, 138, .35), transparent 70%),
      linear-gradient(180deg, var(--lilac) 0%, #d9c3ee 45%, var(--peach) 100%);
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .18; mix-blend-mode: soft-light;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  main {
    position: relative; width: min(560px, calc(100% - 32px)); margin: var(--space-4) 0;
    text-align: center; background: var(--paper);
    border: 3px solid var(--plum); border-radius: 28px;
    padding: var(--space-5) clamp(20px, 6vw, 48px) var(--space-4);
    box-shadow: 0 6px 0 var(--plum), 0 18px 40px -12px rgba(62, 47, 99, .35), 0 40px 80px -30px rgba(62, 47, 99, .25);
  }
  .lives { display: inline-flex; gap: 4px; margin-bottom: var(--space-2); }
  .lives svg { width: 22px; height: 22px; }
  h1 { font: 800 clamp(40px, 10vw, 60px)/1 "Sniglet", sans-serif; letter-spacing: -0.03em; margin: 0 0 var(--space-2); }
  p { margin: 0 0 var(--space-3); color: var(--plum-soft); }
  .soon {
    display: inline-block; font: 800 15px/1 "Sniglet", sans-serif; letter-spacing: .06em; text-transform: uppercase;
    background: var(--butter); border: 3px solid var(--plum); border-radius: 999px;
    padding: 10px 18px; box-shadow: 0 3px 0 var(--plum); transform: rotate(-2deg); margin-bottom: var(--space-4);
  }
  nav { display: flex; gap: var(--space-3); justify-content: center; flex-wrap: wrap; font-size: 15px; }
  a {
    color: var(--plum); font-weight: 700;
    text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; text-decoration-color: var(--lilac);
    border-radius: 4px; display: inline-block; transition: transform .25s var(--spring), opacity .2s ease;
  }
  a:hover { transform: translateY(-1px); text-decoration-color: var(--plum); }
  a:active { transform: translateY(1px); opacity: .7; }
  a:focus-visible { outline: 3px solid var(--plum); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { a { transition: none; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.8 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z" fill="#ffe08a" stroke="#3e2f63" stroke-width="2" stroke-linejoin="round"/></symbol>
</svg>
<main>
  <div class="lives" aria-hidden="true">
    <svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg>
    <svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg>
    <svg><use href="#star"/></svg><svg><use href="#star"/></svg><svg><use href="#star"/></svg>
  </div>
  <h1>Nine Lives Inc.</h1>
  <p>A cozy idle game for Android. Run an afterlife sanctuary for cats, collect Whiskers and give every cat all nine lives.</p>
  <div class="soon">Coming soon to Google Play</div>
  <nav>
    <a href="privacy.html">Privacy policy</a>
    <a href="mailto:amevesh@gmail.com">Contact</a>
  </nav>
</main>
</body>
</html>
